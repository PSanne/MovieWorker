name: Release

# Veröffentlicht ein GitHub-Release mit ZIP-Download (inkl. FFmpeg). Zwei Wege:
#  1. Actions → „Release“ → „Run workflow“ → Versionsnummer eingeben (legt die Marke selbst an)
#  2. Eine Versionsmarke wie "v0.5.0" pushen
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versionsnummer ohne „v“, z. B. 0.5.0"
        required: true
        default: "0.2.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: FFmpeg holen
        shell: pwsh
        run: |
          ./build/get-ffmpeg.ps1 -Destination tools/ffmpeg
          Add-Content $env:GITHUB_PATH "$PWD\tools\ffmpeg"

      - name: Test
        run: dotnet test MovieWorker.sln --configuration Release

      - name: Publish
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart("v")
          dotnet publish src/MovieWorker.App/MovieWorker.App.csproj `
            --configuration Release --runtime win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$version --output publish
          Copy-Item tools/ffmpeg publish/ffmpeg -Recurse
          Copy-Item docs/ANLEITUNG.md publish/Anleitung.md
          Compress-Archive -Path publish/* -DestinationPath "MovieWorker-$($env:TAG)-win-x64.zip"

      - name: Installer bauen
        shell: pwsh
        run: ./build/build-installer.ps1 -Version $env:TAG.TrimStart("v")

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: MovieWorker ${{ env.TAG }}
          files: |
            MovieWorker-${{ env.TAG }}-win-x64.zip
            installer-out/MovieWorker-Setup-${{ env.TAG }}.exe
          body: |
            ## Installation
            **Empfohlen:** `MovieWorker-Setup-${{ env.TAG }}.exe` herunterladen und starten – der Installer legt
            MovieWorker im Startmenü an (auf Wunsch auch auf dem Desktop) und öffnet `.mvproj`-Projekte per Doppelklick.
            Administratorrechte sind nicht nötig.

            **Ohne Installation:** `MovieWorker-${{ env.TAG }}-win-x64.zip` herunterladen, entpacken und `MovieWorker.exe` starten.

            Es muss weder .NET noch FFmpeg installiert sein (FFmpeg liegt bei). Die Anleitung steckt im Programm unter *Hilfe → Anleitung*.

            Falls Windows SmartScreen warnt: **„Weitere Informationen“ → „Trotzdem ausführen“**
            (die Datei ist nicht digital signiert).

            Alle Funktionen und Tastenkürzel stehen in der [README](https://github.com/${{ github.repository }}#readme).
